<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mainScreen.css">
    <title>D&D Character Sheet</title>
</head>
<body>
    <header>
        <h1>Dungeons & Dragons Character Sheet Manager</h1>
        <div id="headerDiv">
            <button id="DMBtn">DM View</button>
            <button id="signOutBtn">Sign Out</button>
        </div>
    </header>
    <main>
        <section id="listSection">
            <h2>Please select a Character to continue or create a new Character.</h2>
            <h3 id="charText"></h3>
            <ul id="charList">
                
            </ul>
            <label for="charNameInput">Character name</label>
            <input type="text" id="charNameInput">
            <button id="createBtn">Create Character</button>
            <h3 id="createError" class="errorMessage"></h3>
        </section>
    </main>
    <script src="mainScreen.js"></script>
</body>
</html>
