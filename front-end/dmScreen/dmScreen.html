<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dmScreen.css">
    <title>D&D Character Sheet</title>
</head>
<body>
    <header>
        <h1>Dungeons & Dragons Character Sheet Manager</h1>
        <div id="headerDiv">
            <button id="backBtn">Go Back</button>
            <button id="signOutBtn">Sign Out</button>
        </div>
    </header>
    <main>
        <section id="campListSection">
            <h2>Dungeons Master Dashboard</h2>
            <h3>Please select a Campaign to continue or create a new Campaign.</h3>
            <h3 id="campText"></h3>
            <ul id="campList">
                
            </ul>
            <label for="campNameInput">Campaign name</label>
            <input type="text" id="campNameInput">
            <button id="createBtn">Create Campaign</button>
            <button id="seeAllBtn">See all Characters</button>
            <h3 id="createError" class="errorMessage"></h3>
        </section>
        <section id="charListSection">
            <h2>Dungeons Master Dashboard</h2>
            <h3>Heres the list of Characters</h3>
            <h3 id="charText"></h3>
            <ul id="charList">
                
            </ul>
            <button id="seeCampBtn">Back to Campaigns</button>
        </section>
    </main>
    <script src="dmScreen.js"></script>
</body>
</html>
